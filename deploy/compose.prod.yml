# Aegis — single-host production stack.
#
# Runs the whole platform behind Caddy, which obtains and renews Let's Encrypt certificates
# automatically. Two hostnames are published:
#
#   https://<AEGIS_APP_HOST>   -> the gateway (demo console + the protected APIs)
#   https://<AEGIS_AUTH_HOST>  -> the authorization server (login, OIDC, admin console)
#
# Everything else — the downstream service, the policy engine, Postgres, Redis — has no
# published port at all. They are reachable only on the internal compose network, which is
# the deployment expressing the same idea the code does: the only ways in are the two front
# doors, and both of them check every request.
#
# Copy .env.example to .env, fill it in, then:
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d --build

name: aegis

services:
  # ---- data stores (internal only) ------------------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis_auth
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d aegis_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- policy decision point (internal only) --------------------------------
  opa:
    build:
      context: ../policies
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- authorization server -------------------------------------------------
  auth-server:
    build:
      context: ..
      dockerfile: aegis-auth-server/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: cloud,prod
      DB_URL: jdbc:postgresql://postgres:5432/aegis_auth
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Baked into every token's `iss` claim and into the OIDC discovery document, so it
      # must be the public HTTPS URL rather than the container's own address.
      AEGIS_ISSUER_URI: https://${AEGIS_AUTH_HOST}
      # The console runs on the gateway's origin and POSTs to /oauth2/token from JavaScript.
      AEGIS_CORS_ALLOWED_ORIGINS: https://${AEGIS_APP_HOST}
      # Must match the console's URL exactly — the authorization server compares literally.
      AEGIS_WEB_CLIENT_REDIRECT_URIS: https://${AEGIS_APP_HOST}/
      AEGIS_DEMO_USER: ${AEGIS_DEMO_USER}
      AEGIS_DEMO_PASSWORD: ${AEGIS_DEMO_PASSWORD}
      # Postgres 18 rejects the legacy "Asia/Calcutta" alias some JVMs report.
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy

  # ---- downstream service (internal only) -----------------------------------
  resource-demo:
    build:
      context: ..
      dockerfile: aegis-resource-demo/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: cloud,prod
      # Validates tokens against the public issuer's JWKS — defense in depth. Even though
      # nothing outside this network can reach it, it still refuses an unsigned request.
      AEGIS_ISSUER_URI: https://${AEGIS_AUTH_HOST}
      TZ: UTC

  # ---- gateway (the only application entry point) ---------------------------
  gateway:
    build:
      context: ..
      dockerfile: aegis-gateway/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: cloud,prod
      AEGIS_ISSUER_URI: https://${AEGIS_AUTH_HOST}
      AEGIS_RESOURCE_DEMO_URI: http://resource-demo:8081
      AEGIS_OPA_URL: http://opa:8181
      REDIS_URL: redis://redis:6379
      AEGIS_DEMO_USER: ${AEGIS_DEMO_USER}
      AEGIS_DEMO_PASSWORD: ${AEGIS_DEMO_PASSWORD}
      TZ: UTC
    depends_on:
      redis:
        condition: service_healthy
      opa:
        condition: service_started

  # ---- TLS termination + routing --------------------------------------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AEGIS_APP_HOST: ${AEGIS_APP_HOST}
      AEGIS_AUTH_HOST: ${AEGIS_AUTH_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Without this volume every restart re-requests
      # certificates and will eventually hit Let's Encrypt's rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - auth-server

volumes:
  pg-data:
  caddy-data:
  caddy-config:
