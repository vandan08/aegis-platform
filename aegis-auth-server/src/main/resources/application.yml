server:
  # PORT is what most container platforms (Render, Fly, Cloud Run, Heroku) inject to tell
  # the process which port to bind. Defaulting to 9000 keeps the documented local setup.
  port: ${PORT:9000}

spring:
  application:
    name: aegis-auth-server

  datasource:
    # Env-first (12-factor): every credential can be injected without touching this file.
    # With the `vault` profile active these are overridden straight from Vault instead.
    # Whole-URL first, then host/port/name parts. Managed Postgres is usually handed over
    # as separate values (or as a postgres:// URL that is not a JDBC URL), and a blueprint
    # cannot concatenate env vars — so the app composes the JDBC URL itself.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aegis_auth}}
    username: ${DB_USERNAME:aegis}
    password: ${DB_PASSWORD:aegis}   # DEV-ONLY default — see docs/ROADMAP.md
    driver-class-name: org.postgresql.Driver

  cloud:
    vault:
      enabled: false   # inert by default; switched on by the `vault` profile below

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# The public issuer URI other services use to discover / validate tokens. It must be the
# URL clients actually reach this server on: it is baked into the `iss` claim of every
# token and into the OIDC discovery document, so a mismatch makes every downstream
# validation fail with "invalid issuer" even though the signature is perfectly good.
  security:
    oauth2:
      authorizationserver:
        issuer: ${AEGIS_ISSUER_URI:http://localhost:9000}

# Aegis-specific security tuning.
aegis:
  security:
    lockout:
      max-attempts: 5          # consecutive failures before a temporary lock
      lockout-duration: 15m    # how long the account stays locked

  # Browser-based clients (the gateway's demo console) run on a different origin and must
  # POST to /oauth2/token from JavaScript, so that origin has to be allowed explicitly.
  # An empty list disables CORS entirely, which is the right default for a private deployment.
  cors:
    allowed-origins: ${AEGIS_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

  # Demo seed data. Every value here is DEV/DEMO ONLY - see docs/ROADMAP.md.
  demo:
    # Redirect URIs registered for the public web client. The demo console redirects back to
    # the gateway root, so this must list the gateway's public URL in a deployed environment.
    web-client-redirect-uris: ${AEGIS_WEB_CLIENT_REDIRECT_URIS:http://localhost:8080/,http://127.0.0.1:8080/,http://127.0.0.1:8080/login/oauth2/code/aegis}
    # A non-admin account, so the policy demo can show denials. An admin would be allowed
    # everything by the RBAC rule and the ABAC scenarios would all trivially pass.
    user: ${AEGIS_DEMO_USER:alice}
    password: ${AEGIS_DEMO_PASSWORD:aegis-demo-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,sbom
  endpoint:
    health:
      show-details: when-authorized
  # Observability (Phase 4): Prometheus metrics + OTLP tracing across the platform.
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${AEGIS_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.security: INFO

---
# Container / production profile: ECS JSON logs on stdout, each line carrying traceId/spanId.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs

---
# Managed-cloud profile: the deployed demo runs without an OTLP collector, so tracing export
# is switched off rather than left retrying a dead endpoint every span. Activate as `cloud,prod`.
spring:
  config:
    activate:
      on-profile: cloud
management:
  tracing:
    enabled: false
server:
  # Behind a TLS-terminating proxy (Caddy, Render's edge, an ingress controller) the app
  # itself speaks plain HTTP. Without honouring X-Forwarded-*, Spring builds redirects and
  # absolute URLs as http://internal-host:port — which for an authorization server means the
  # login redirect bounces the browser out of HTTPS and OAuth2 flows break.
  forward-headers-strategy: framework

---
# Secrets-from-Vault profile (Phase 4): SPRING_PROFILES_ACTIVE=vault pulls secrets
# (e.g. spring.datasource.password) from Vault's KV store at secret/aegis-auth-server,
# overriding anything in this file. Seed dev secrets with scripts/vault-seed.ps1 (or .sh).
# TOKEN auth + plain HTTP are DEV ONLY — production uses TLS + AppRole/Kubernetes auth.
spring:
  config:
    activate:
      on-profile: vault
    import: vault://
  cloud:
    vault:
      enabled: true
      uri: ${VAULT_ADDR:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:aegis-dev-token}   # DEV ONLY — see docs/ROADMAP.md
      kv:
        enabled: true
        backend: secret
        application-name: aegis-auth-server
