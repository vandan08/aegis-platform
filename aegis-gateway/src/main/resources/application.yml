server:
  # PORT is what most container platforms (Render, Fly, Cloud Run, Heroku) inject to tell
  # the process which port to bind. Defaulting to 8080 keeps the documented local setup.
  port: ${PORT:8080}

spring:
  application:
    name: aegis-gateway

  data:
    redis:
      # A single URL rather than host/port: managed Redis is handed over as one
      # `rediss://user:password@host:port` string, and splitting it into parts would
      # drop the credentials and the TLS scheme.
      url: ${REDIS_URL:redis://localhost:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Gateway discovers the JWKS from the auth server and validates every token.
          # Discovery is lazy (Boot wraps this in a SupplierJwtDecoder), so the gateway
          # still starts when the auth server is cold — it resolves on the first token.
          issuer-uri: ${AEGIS_ISSUER_URI:http://localhost:9000}

  # NOTE: this block must stay under `spring:`. It was briefly indented under `aegis:`,
  # which is silently inert — the properties bind to nothing, the gateway starts happily
  # with an empty route table, and every proxied path 404s.
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: resource-demo
              # Plain HTTP in dev; the mtls profile flips this to https (see below).
              uri: ${aegis.routes.resource-demo-uri}
              predicates:
                - Path=/api/demo/**
              filters:
                # Token-bucket rate limiter (Redis). Phase 4: keyed per-user / per-client
                # (JWT sub or client_id) rather than per-route, so one noisy caller cannot
                # exhaust everyone else's budget.
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@principalOrClientKeyResolver}"
                # Phase 4: Resilience4j circuit breaker. If the downstream trips the
                # failure/latency thresholds the breaker opens and requests are served a
                # local fallback (503) instead of piling onto an unhealthy service.
                - name: CircuitBreaker
                  args:
                    name: resourceDemoCircuitBreaker
                    fallbackUri: forward:/fallback/resource-demo

            # The profile API the ABAC ownership rule governs. Same downstream, same
            # limiter and breaker — the difference is purely which policy rule applies,
            # which is the point: enforcement is uniform, authorization is per-resource.
            - id: user-profile
              uri: ${aegis.routes.resource-demo-uri}
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@principalOrClientKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: resourceDemoCircuitBreaker
                    fallbackUri: forward:/fallback/resource-demo

# Fine-grained authorization (Phase 3): the gateway asks OPA (the Policy Decision
# Point) to allow/deny each authenticated request. Fail-closed on any PDP error.
aegis:
  authz:
    opa:
      enabled: ${AEGIS_OPA_ENABLED:true}
      url: ${AEGIS_OPA_URL:http://localhost:8181}
      decision-path: /v1/data/aegis/authz/allow
      timeout: ${AEGIS_OPA_TIMEOUT:500ms}

  # Where the gateway proxies the demo API. Overridden by the `mtls` profile (https) and
  # by AEGIS_RESOURCE_DEMO_URI in deployed environments.
  routes:
    resource-demo-uri: ${AEGIS_RESOURCE_DEMO_URI:http://localhost:8081}

  # The interactive demo console served at the gateway root (static/index.html). It drives a
  # real Authorization Code + PKCE login and then fires real requests through this gateway,
  # so what a visitor sees is the live enforcement path, not a mock.
  playground:
    enabled: ${AEGIS_PLAYGROUND_ENABLED:true}
    issuer-uri: ${AEGIS_ISSUER_URI:http://localhost:9000}
    client-id: ${AEGIS_WEB_CLIENT_ID:aegis-web-client}
    scopes: openid,profile,demo.read,demo.write
    # Shown on the page so anyone can try the sandbox. DEV/DEMO ONLY - see docs/ROADMAP.md.
    demo-user: ${AEGIS_DEMO_USER:alice}
    demo-password: ${AEGIS_DEMO_PASSWORD:aegis-demo-2026}

# Resilience4j (Phase 4) — tuning for the downstream circuit breaker + its time limiter.
resilience4j:
  circuitbreaker:
    instances:
      resourceDemoCircuitBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50          # open once >=50% of a window fails
        wait-duration-in-open-state: 10s     # stay open this long before probing
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      resourceDemoCircuitBreaker:
        timeout-duration: 3s                 # a call slower than this counts as a failure

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,sbom
  endpoint:
    health:
      show-details: when-authorized
  # Observability (Phase 4): tag every meter with the service name (for Grafana) and
  # export traces over OTLP. Sample everything in dev; dial down in real environments.
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${AEGIS_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

---
# Container / production profile: emit logs as ECS JSON on stdout (12-factor), each line
# carrying the traceId/spanId Micrometer puts in the MDC so logs correlate with traces.
# Never logs tokens — only claim-derived identifiers appear in our own log statements.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs

---
# Managed-cloud profile: the deployed demo runs without an OTLP collector, so tracing export
# is switched off rather than left retrying a dead endpoint every span. Activate as `cloud,prod`.
spring:
  config:
    activate:
      on-profile: cloud
management:
  tracing:
    enabled: false
server:
  # Behind a TLS-terminating proxy (Caddy, Render's edge, an ingress controller) the app
  # itself speaks plain HTTP. Without honouring X-Forwarded-*, Spring builds redirects and
  # absolute URLs as http://internal-host:port — which for an authorization server means the
  # login redirect bounces the browser out of HTTPS and OAuth2 flows break.
  forward-headers-strategy: framework

---
# mTLS profile (Phase 4): service identity between gateway and downstream services.
# The gateway presents its own client certificate (signed by the dev CA) on every
# proxied call and only trusts servers signed by that CA — so a stolen user JWT is
# not enough to talk to a service directly; the caller must ALSO be the gateway.
# Generate the material first: scripts/gen-dev-certs.ps1 (or .sh).
spring:
  config:
    activate:
      on-profile: mtls
  ssl:
    bundle:
      jks:
        gateway-client:
          keystore:
            location: ${AEGIS_CERTS_DIR:file:../certs}/gateway-keystore.p12
            password: ${AEGIS_CERTS_PASSWORD:changeit}   # DEV ONLY — see docs/ROADMAP.md
            type: PKCS12
          truststore:
            location: ${AEGIS_CERTS_DIR:file:../certs}/truststore.p12
            password: ${AEGIS_CERTS_PASSWORD:changeit}
            type: PKCS12
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            ssl:
              ssl-bundle: gateway-client
aegis:
  routes:
    resource-demo-uri: https://localhost:8081
